# Production Multi-Tier Inventory (INI Format)

# Bastion / Jump Host (Ungrouped)
bastion.example.com ansible_host=203.0.113.10 ansible_user=bastion_admin

# Frontend Web Tier (with numeric range)
[webservers]
web[01:04].example.com http_port=80 max_clients=500
web05.example.com http_port=8080 ansible_host=192.168.10.15

# Backend Application Tier
[appservers]
app[01:03].example.com app_port=9000

# Database Tier (with alphabetic range)
[dbservers]
db-[a:b].example.com db_port=5432

# Master / Primary Node
[db_primary]
db-a.example.com

# Replicas
[db_replicas]
db-b.example.com

# Parent Group: Production Environment
[production:children]
webservers
appservers
dbservers

# Production Group Variables
[production:vars]
environment_tier=production
ansible_user=deploy
ansible_connection=ssh
ansible_ssh_common_args='-o ProxyJump=bastion_admin@203.0.113.10'
