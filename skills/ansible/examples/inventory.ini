# Production INI Inventory Example

[loadbalancers]
lb01.prod.internal ansible_host=10.0.1.10
lb02.prod.internal ansible_host=10.0.1.11

[webservers]
web[01:04].prod.internal

[databases]
db-primary.prod.internal ansible_host=10.0.3.10
db-replica[01:02].prod.internal

[production:children]
loadbalancers
webservers
databases

[production:vars]
env=production
ansible_user=automation
ansible_become=true
ansible_become_method=sudo
http_port=80
https_port=443
