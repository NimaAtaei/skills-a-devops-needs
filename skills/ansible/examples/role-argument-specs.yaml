# Example Role Argument Validation Specification
# Place in roles/<role_name>/meta/argument_specs.yml

argument_specs:
  main:
    short_description: Deploy and configure the production application service
    description:
      - Validates all input variables before role execution begins.
      - Provides fail-fast error detection for missing required parameters.
    author:
      - DevOps & SRE Team
    options:
      app_name:
        type: str
        required: true
        description: Unique name of the application service.

      app_port:
        type: int
        required: false
        default: 8080
        description: TCP listening port for the application server.

      app_version:
        type: str
        required: true
        description: Application semantic release tag to deploy.

      environment_tier:
        type: str
        required: false
        choices:
          - development
          - staging
          - production
        default: production
        description: Target environment deployment tier.

      database_config:
        type: dict
        required: true
        description: Database connection parameters.
        options:
          host:
            type: str
            required: true
          port:
            type: int
            default: 5432
          user:
            type: str
            required: true
          ssl_mode:
            type: str
            choices:
              - disable
              - require
              - verify-full
            default: require
