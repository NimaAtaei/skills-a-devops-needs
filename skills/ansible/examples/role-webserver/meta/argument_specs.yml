---
argument_specs:
  main:
    short_description: Deploy and configure webserver
    description: Installs Nginx, configures virtual host, and manages service state.
    author: DevOps Team
    options:
      http_port:
        type: int
        default: 80
        description: Listening HTTP port
      server_name:
        type: str
        required: true
        description: FQDN of the virtual host
      doc_root:
        type: str
        default: /var/www/html
        description: Document root directory
