---
# Tasks for role-webserver
- name: Install webserver package
  ansible.builtin.package:
    name: nginx
    state: present

- name: Ensure document root directory exists
  ansible.builtin.file:
    path: "{{ doc_root }}"
    state: directory
    owner: www-data
    group: www-data
    mode: "0755"

- name: Deploy webserver configuration
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: /etc/nginx/nginx.conf
    mode: "0644"
  notify: Reload Webserver

- name: Ensure webserver service is started and enabled
  ansible.builtin.service:
    name: nginx
    state: started
    enabled: true
