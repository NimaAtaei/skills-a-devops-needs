apiVersion: cilium.io/v2
kind: CiliumLoadBalancerIPPool
metadata:
  name: prod-lb-pool
spec:
  blocks:
    - cidr: "192.168.100.0/24"
  allowFirstLastIPs: "No"
  serviceSelector:
    matchLabels:
      io.kubernetes.service.namespace: production
---
apiVersion: cilium.io/v2
kind: CiliumBGPAdvertisement
metadata:
  name: bgp-advertisements
  labels:
    advertise: bgp
spec:
  advertisements:
    - advertisementType: "PodCIDR"
      attributes:
        communities:
          standard: ["65000:100"]
    - advertisementType: "Service"
      service:
        addresses:
          - LoadBalancerIP
      selector:
        matchExpressions:
          - key: io.kubernetes.service.namespace
            operator: In
            values: ["production"]
      attributes:
        communities:
          standard: ["65000:200"]
---
apiVersion: cilium.io/v2
kind: CiliumBGPPeerConfig
metadata:
  name: tor-peer-config
spec:
  timers:
    connectRetryTimeSeconds: 5
    holdTimeSeconds: 18
    keepAliveTimeSeconds: 6
  gracefulRestart:
    enabled: true
    restartTimeSeconds: 120
  families:
    - afi: ipv4
      safi: unicast
      advertisements:
        matchLabels:
          advertise: bgp
---
apiVersion: cilium.io/v2
kind: CiliumBGPClusterConfig
metadata:
  name: cilium-bgp
spec:
  nodeSelector:
    matchLabels:
      rack: rack-01
  bgpInstances:
    - name: "instance-65001"
      localASN: 65001
      peers:
        - name: "tor-switch-01"
          peerASN: 65000
          peerAddress: "10.0.0.1"
          peerConfigRef:
            name: "tor-peer-config"
