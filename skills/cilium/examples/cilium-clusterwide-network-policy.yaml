apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: baseline-zero-trust
spec:
  description: "Cluster-wide baseline: deny external world ingress and allow essential DNS, kube-apiserver, and health checks"
  endpointSelector:
    matchExpressions:
      - key: io.kubernetes.pod.namespace
        operator: NotIn
        values:
          - kube-system
  ingressDeny:
    - fromEntities:
        - world
  ingress:
    - fromEntities:
        - cluster
        - health
  egress:
    - toEntities:
        - kube-apiserver
        - health
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchPattern: "*"
