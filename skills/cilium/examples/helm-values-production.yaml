# Production Cilium v1.20.5 Helm Values
# Install:
#   helm install cilium oci://quay.io/cilium/charts/cilium --version 1.20.5 \
#     --namespace kube-system -f helm-values-production.yaml

cluster:
  name: prod-us-east-1
  id: 1

routingMode: native
ipv4NativeRoutingCIDR: "10.244.0.0/16"
autoDirectNodeRoutes: true

kubeProxyReplacement: true
k8sServiceHost: "api.k8s.internal"
k8sServicePort: 6443

socketLB:
  enabled: true
  hostNamespaceOnly: false

loadBalancer:
  mode: snat # Use "dsr" or "hybrid" when source IP preservation is needed
  algorithm: maglev
  acceleration: disabled # Set "native" on supported XDP NICs

maglev:
  tableSize: 16381
  hashSeed: "c29tZS1yYW5kb20tMTItYnl0ZXM="

ipam:
  mode: cluster-pool
  operator:
    clusterPoolIPv4PodCIDRList:
      - "10.244.0.0/16"
    clusterPoolIPv4MaskSize: 24

bpf:
  masquerade: true
  hostLegacyRouting: false
  mapDynamicSizeRatio: 0.0025
  distributedLRU:
    enabled: true

bandwidthManager:
  enabled: true
  bbr: true

encryption:
  enabled: true
  type: wireguard
  nodeEncryption: false

bgpControlPlane:
  enabled: true

gatewayAPI:
  enabled: true

hubble:
  enabled: true
  eventQueueSize: 16384
  relay:
    enabled: true
    replicas: 2
  ui:
    enabled: true
    replicas: 1
  metrics:
    enabled:
      - dns:query;ignoreAAAA
      - drop
      - tcp
      - flow
      - port-distribution
      - icmp
      - httpV2:exemplars=true;labelsContext=source_ip,source_namespace,source_workload,destination_ip,destination_namespace,destination_workload,traffic_direction
    enableOpenMetrics: true
    serviceMonitor:
      enabled: true

prometheus:
  enabled: true
  serviceMonitor:
    enabled: true

operator:
  replicas: 2
  prometheus:
    enabled: true
    serviceMonitor:
      enabled: true

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: 2000m
    memory: 2Gi
