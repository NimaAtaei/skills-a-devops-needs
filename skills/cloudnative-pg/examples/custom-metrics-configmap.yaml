apiVersion: v1
kind: ConfigMap
metadata:
  name: cnpg-custom-metrics
  namespace: database
data:
  user-defined-metrics.yaml: |
    # Metric 1: Track dead tuples (table bloat indicator)
    pg_table_dead_tuples:
      query: "SELECT schemaname, relname, n_dead_tup FROM pg_catalog.pg_stat_user_tables;"
      metrics:
        - schemaname:
            usage: "LABEL"
            description: "Database schema name"
        - relname:
            usage: "LABEL"
            description: "Table name"
        - n_dead_tup:
            usage: "GAUGE"
            description: "Estimated dead rows in table"

    # Metric 2: Long-running transactions (> 60 seconds)
    pg_long_running_transactions:
      query: |
        SELECT count(*) as count
        FROM pg_catalog.pg_stat_activity
        WHERE state != 'idle'
          AND (pg_catalog.now() - xact_start) > interval '60 seconds';
      metrics:
        - count:
            usage: "GAUGE"
            description: "Number of active transactions running longer than 60 seconds"
