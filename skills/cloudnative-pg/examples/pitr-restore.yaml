apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: cluster-production-restored
  namespace: database
spec:
  instances: 3
  imageName: ghcr.io/cloudnative-pg/postgresql:17.4

  storage:
    size: 100Gi
    storageClass: gp3-nvme
  walStorage:
    size: 30Gi
    storageClass: gp3-nvme

  # Bootstrapping by recovering from an external backup location
  bootstrap:
    recovery:
      source: production-backup-source
      target:
        # Point-in-time recovery target timestamp (UTC)
        targetTime: "2026-11-20T12:00:00Z"

  externalClusters:
    - name: production-backup-source
      barmanObjectStore:
        destinationPath: "s3://company-pg-backups/cluster-production/"
        endpointURL: "https://s3.amazonaws.com"
        s3Credentials:
          accessKeyId:
            name: s3-backup-secret
            key: ACCESS_KEY_ID
          secretAccessKey:
            name: s3-backup-secret
            key: SECRET_ACCESS_KEY
