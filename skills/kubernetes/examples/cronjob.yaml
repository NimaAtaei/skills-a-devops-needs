apiVersion: batch/v1
kind: CronJob
metadata:
  name: nightly-cache-purge
  namespace: production
  labels:
    app.kubernetes.io/name: cache-purge
spec:
  # Run every night at 03:00 UTC
  schedule: "0 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  startingDeadlineSeconds: 200
  jobTemplate:
    spec:
      backoffLimit: 3
      activeDeadlineSeconds: 1800 # Terminate if running longer than 30 minutes
      template:
        metadata:
          labels:
            app.kubernetes.io/name: cache-purge
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: purge
              image: ghcr.io/org/cache-cleaner:v1.0.0
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              resources:
                requests:
                  cpu: 250m
                  memory: 256Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
              env:
                - name: REDIS_HOST
                  value: "redis-headless.production.svc.cluster.local"
