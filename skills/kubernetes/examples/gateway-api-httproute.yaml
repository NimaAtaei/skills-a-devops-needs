---
# Gateway API HTTPRoute defining routing rules and canary traffic splitting
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: store-route
  namespace: production
spec:
  parentRefs:
    - name: production-gateway
      namespace: infra
  hostnames:
    - "store.company.com"
  rules:
    # Health check endpoint
    - matches:
        - path:
            type: Exact
            value: /healthz
      backendRefs:
        - name: store-v1
          port: 8080

    # API traffic splitting: 90% to v1, 10% to v2 (canary release)
    - matches:
        - path:
            type: PathPrefix
            value: /api/v1
      backendRefs:
        - name: store-v1
          port: 8080
          weight: 90
        - name: store-v2
          port: 8080
          weight: 10
