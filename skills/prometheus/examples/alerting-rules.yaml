# Production alerting rules for infrastructure and application monitoring.
# Mount at: /etc/prometheus/rules/alerting-rules.yml
#
# Follows best practices:
# - Symptom-based alerts for paging (critical)
# - Cause-based alerts for dashboards (warning)
# - All alerts have for: duration, runbook_url, and severity labels

groups:
  # =====================================================================
  # Target Health
  # =====================================================================
  - name: target-health
    rules:
      - alert: TargetDown
        expr: up == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Target {{ $labels.job }}/{{ $labels.instance }} is down"
          description: "{{ $labels.instance }} of job {{ $labels.job }} has been down for more than 5 minutes."
          runbook_url: "https://wiki.example.com/runbook/target-down"

      - alert: TooManyTargetScrapeFailures
        expr: |
          sum by (job) (up == 0)
          / count by (job) (up)
          > 0.5
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "More than 50% of {{ $labels.job }} targets are down"
          description: "{{ $value | humanizePercentage }} of targets in job {{ $labels.job }} are failing."

      - alert: ScrapeDurationHigh
        expr: scrape_duration_seconds > 10
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Scrape duration high for {{ $labels.instance }}"
          description: "Scrape takes {{ $value | humanizeDuration }} (> 10s threshold)."

      # Dead man's switch — always firing; alerts if it stops
      - alert: Watchdog
        expr: vector(1)
        labels:
          severity: none
        annotations:
          summary: "Watchdog alert confirms alerting pipeline is functional"

  # =====================================================================
  # Node / Host Alerts (Node Exporter)
  # =====================================================================
  - name: node-alerts
    rules:
      - alert: NodeHighCPU
        expr: |
          100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 90
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage on {{ $labels.instance }}"
          description: "CPU usage is {{ $value | humanize }}% (> 90% threshold)."

      - alert: NodeHighMemory
        expr: |
          (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100 > 90
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage on {{ $labels.instance }}"
          description: "Memory usage is {{ $value | humanize }}% (> 90% threshold)."

      - alert: NodeFilesystemAlmostFull
        expr: |
          (1 - node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes) * 100 > 85
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Filesystem almost full on {{ $labels.instance }}"
          description: "{{ $labels.mountpoint }} is {{ $value | humanize }}% full."

      - alert: NodeFilesystemFull
        expr: |
          (1 - node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes) * 100 > 95
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Filesystem critically full on {{ $labels.instance }}"
          description: "{{ $labels.mountpoint }} is {{ $value | humanize }}% full."

      - alert: NodeFilesystemRunningOut
        expr: |
          predict_linear(node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"}[6h], 24*3600) < 0
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "Filesystem will fill within 24h on {{ $labels.instance }}"
          description: "{{ $labels.mountpoint }} is predicted to run out of space within 24 hours."

      - alert: NodeNetworkErrors
        expr: |
          rate(node_network_receive_errs_total[5m]) + rate(node_network_transmit_errs_total[5m]) > 10
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Network errors on {{ $labels.instance }}"
          description: "{{ $labels.device }}: {{ $value | humanize }} errors/sec."

      - alert: NodeClockSkew
        expr: |
          abs(node_timex_offset_seconds) > 0.05
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Clock skew detected on {{ $labels.instance }}"
          description: "Clock offset is {{ $value | humanize }}s (> 50ms threshold)."

  # =====================================================================
  # Kubernetes Alerts
  # =====================================================================
  - name: kubernetes-alerts
    rules:
      - alert: KubePodCrashLooping
        expr: |
          increase(kube_pod_container_status_restarts_total[1h]) > 5
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} is crash looping"
          description: "Container {{ $labels.container }} restarted {{ $value | humanize }} times in the last hour."

      - alert: KubePodNotReady
        expr: |
          kube_pod_status_phase{phase=~"Pending|Unknown"} == 1
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} is not ready"
          description: "Pod has been in {{ $labels.phase }} state for more than 15 minutes."

      - alert: KubeDeploymentReplicasMismatch
        expr: |
          kube_deployment_spec_replicas != kube_deployment_status_ready_replicas
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Deployment {{ $labels.namespace }}/{{ $labels.deployment }} replicas mismatch"
          description: "Expected {{ with printf `kube_deployment_spec_replicas{namespace='%s',deployment='%s'}` $labels.namespace $labels.deployment | query }}{{ . | first | value }}{{ end }} replicas, got {{ with printf `kube_deployment_status_ready_replicas{namespace='%s',deployment='%s'}` $labels.namespace $labels.deployment | query }}{{ . | first | value }}{{ end }} ready."

      - alert: KubeNodeNotReady
        expr: kube_node_status_condition{condition="Ready", status="true"} == 0
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Kubernetes node {{ $labels.node }} is not ready"
          description: "Node has been not ready for more than 10 minutes."

      - alert: KubePersistentVolumeFillingUp
        expr: |
          kubelet_volume_stats_available_bytes / kubelet_volume_stats_capacity_bytes < 0.15
          and
          kubelet_volume_stats_used_bytes > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "PVC {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} filling up"
          description: "Only {{ $value | humanizePercentage }} of space remaining."

  # =====================================================================
  # Application SLO Alerts
  # =====================================================================
  - name: application-slo
    rules:
      - alert: HighErrorRate
        expr: |
          sum by (job) (rate(http_requests_total{code=~"5.."}[5m]))
          / sum by (job) (rate(http_requests_total[5m]))
          > 0.01
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "High 5xx error rate for {{ $labels.job }}"
          description: "Error rate is {{ $value | humanizePercentage }} (> 1% threshold)."

      - alert: HighLatency
        expr: |
          histogram_quantile(0.99,
            sum by (job, le) (rate(http_request_duration_seconds_bucket[5m]))
          ) > 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High p99 latency for {{ $labels.job }}"
          description: "p99 latency is {{ $value | humanizeDuration }}."

  # =====================================================================
  # Prometheus Self-Monitoring
  # =====================================================================
  - name: prometheus-self
    rules:
      - alert: PrometheusConfigReloadFailed
        expr: prometheus_config_last_reload_successful == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Prometheus config reload failed"
          description: "Configuration reload failed. Check logs for syntax errors."

      - alert: PrometheusRuleEvaluationFailures
        expr: rate(prometheus_rule_evaluation_failures_total[5m]) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Prometheus rule evaluation failures"
          description: "{{ $value | humanize }} rule evaluation failures per second."

      - alert: PrometheusRemoteWriteBehind
        expr: prometheus_remote_storage_samples_pending > 50000
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Prometheus remote write falling behind"
          description: "{{ $value | humanize }} samples pending in remote write queue."

      - alert: PrometheusTSDBCompactionsFailing
        expr: increase(prometheus_tsdb_compactions_failed_total[3h]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Prometheus TSDB compactions are failing"
          description: "TSDB compaction failures detected in the last 3 hours."
