# Production-style Zabbix proxy and agent configuration snippets
# ─────────────────────────────────────────────────────────────────────────────
# /etc/zabbix/zabbix_proxy.conf — ACTIVE proxy for a remote site / DMZ
# Buffer mode "hybrid" (7.0+) keeps collection fast in memory with crash safety.

ProxyMode=0                          # 0 = active (proxy connects to server)
ServerActive=zbx.example.com:10051   # server address the proxy connects to
Hostname=proxy-dc2                   # MUST match the proxy object name in the frontend

ProxyBufferMode=hybrid               # memory | hybrid | disk (7.0+)
ProxyMemoryBufferSize=128M           # in-memory buffer size (7.0+)
ProxyOfflineBuffer=24                # hours of disk buffer if the server is unreachable

ConfigFrequency=300                  # seconds between config fetches (active mode)
DataSenderFrequency=5                # seconds between data uploads (active mode)

StartPollers=25
StartTrappers=10
StartPingers=5
CacheSize=512M                       # config cache on the proxy side
Timeout=10

TLSConnect=psk                       # active connections are outbound + PSK-encrypted
TLSPSKIdentity=proxy-dc2-psk
TLSPSKFile=/etc/zabbix/secrets/proxy.psk   # chmod 600, openssl rand -hex 32

LogFileSize=64                       # rotate instead of unlimited logs

# ─────────────────────────────────────────────────────────────────────────────
# /etc/zabbix/zabbix_agent2.conf — host behind the active proxy
# Agents point at the PROXY (not the server) in proxied environments.

PidFile=/var/run/zabbix/zabbix_agent2.pid
LogType=file
LogFile=/var/log/zabbix/zabbix_agent2.log
LogFileSize=32

Server=proxy-dc2.example.com          # allowed pollers for PASSIVE checks
ServerActive=proxy-dc2.example.com:10051   # where ACTIVE checks fetch config & push data
Hostname=web-01.example.com           # or HostnameItem=system.hostname

RefreshActiveChecks=120               # seconds between active-check config refreshes
BufferSend=5                          # seconds between active value pushes
BufferSize=100                        # in-memory values held between sends

Timeout=10                            # keep UserParameter commands under this

TLSAccept=psk                         # inbound passive checks require PSK
TLSPSKIdentity=web-01-psk
TLSPSKFile=/etc/zabbix/secrets/agent.psk

# Include for custom UserParameter files (see userparameter-examples.conf)
Include=/etc/zabbix/zabbix_agent2.d/*.conf

# Plugins (agent2) — example: Docker metrics collection enabled
Plugins.Docker.Endpoint=unix:///var/run/docker.sock

# ─────────────────────────────────────────────────────────────────────────────
# Verification after rollout:
#   zabbix_proxy -t                  # validate proxy config file
#   zabbix_agent2 -t vfs.fs.size[/,pused]   # validate agent + one key
#   zabbix_get -s web-01.example.com -k agent.ping    # passive reachability
#   (frontend) Latest data on the proxy host — check delay + collected values
