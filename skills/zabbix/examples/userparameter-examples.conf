# Custom Zabbix agent checks — production-style examples
#
# Place the file in the agent's Include directory, e.g.:
#   Linux:  /etc/zabbix/zabbix_agentd.d/userparameter-custom.conf
#   Windows: C:\Program Files\Zabbix Agent 2\zabbix_agent2.d\custom.conf
# then restart the agent. Keys work on both agent and agent2.

# ─── Linux ───────────────────────────────────────────────────────────────────

# Simple service health: comma-separated active/failed states
# Item: type ZABBIX_ACTIVE, key custom.health.services, string
UserParameter=custom.health.services,systemctl is-active nginx redis-server postgresql | tr '\n' ','

# Parameterized process count — note the quoting around $1 (untrusted input!)
# Item: key custom.proc.count[nginx]
UserParameter=custom.proc.count[*],pgrep -fc "$1" || true

# Multi-value discovery + metrics from a single script (trapper/LLD pattern)
# Emits LLD JSON: {"data":[{"{#QUEUE}":"orders","{#DEPTH}":"12"}]}
UserParameter=custom.queues.discovery,/usr/local/bin/zbx_queues.py discovery
UserParameter=custom.queue.depth[*],/usr/local/bin/zbx_queues.py depth "$1"

# Disk write latency from /proc (numeric, in ms) with a sane fallback
UserParameter=custom.disk.wlat[*],awk -v dev="$1" '$3==dev {print $10/10; found=1} END {if(!found) print 0}' /proc/diskstats

# ─── Windows (agent2) ────────────────────────────────────────────────────────

# Service state via PowerShell — quote and sanitize $1
# Item: key custom.win.service[pgsql]
UserParameter=custom.win.service[*],powershell -NoProfile -Command "(Get-Service -Name $1).Status"

# Free disk percent for a fixed drive (no parameters = no injection surface)
UserParameter=custom.win.freedisk.c,powershell -NoProfile -Command "$d=Get-PSDrive C; [math]::Round($d.Free/$d.Used*100,1)"

# ─── Notes ───────────────────────────────────────────────────────────────────
# - UnsafeUserParameters=1 allows '#' and whitespace in arguments — avoid it;
#   fixed-key variants (no [*]) are safer for anything privileged.
# - Keep every command under the agent Timeout; long jobs belong in scripts
#   writing to trapper items via zabbix_sender instead.
# - Validate with: zabbix_agentd -t custom.proc.count[nginx]
